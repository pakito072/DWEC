<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--Fuente de letra-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="libs/datatables/datatables.min.css">
  <link rel="stylesheet" href="css/styles.css">

  <title>Eventos</title>
</head>

<body class="bg-gr">
  <div class="container bg-dark rounded-4 mt-5 mb-5 pt-3 pb-4 shadow-lg">
    <h1 class="text-center text-white fw-bold roboto mb-3">Login/Register</h1>

    <div class="row">
      <!-- Formulario de Login -->
      <div class="col">
        <div class="card bg-light p-4 rounded-3 shadow">
          <h2 class="text-center mb-4">Login</h2>
          <form>
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="Ingresa tu email" required>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
          </form>
        </div>
      </div>
    
      <!-- Formulario de Register -->
      <div class="col">
        <div class="card bg-light p-4 rounded-3 shadow">
          <h2 class="text-center mb-4">Registro</h2>
          <form>
            <div class="mb-3">
              <label for="registerName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="registerName" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="mb-3">
              <label for="registerEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="registerEmail" placeholder="Ingresa tu email" required>
            </div>
            <div class="mb-3">
              <label for="registerPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="registerPassword" placeholder="Crea una contraseña" required>
            </div>
            <div class="mb-3">
              <label for="registerConfirmPassword" class="form-label">Confirmar Contraseña</label>
              <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Confirma tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Registrarse</button>
          </form>
        </div>
      </div>
    </div>

      

    </div>
  </div>


  <script src="js/script.js"></script>
  <script src="libs/bootstrap/js/bootstrap.min.js"></script>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/datatables/datatables.min.js"></script>
</body>

</html>
